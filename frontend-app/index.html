<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav>
      <div class="logo">MyApp</div>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#stats">Stats</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <h1>Welcome to MyApp <span class="version-badge">v2.0</span></h1>
      <p>A simple, fast, and beautiful web application.</p>
      <a href="#about" class="btn">Learn More</a>
    </section>

    <section id="about" class="section">
      <h2>About</h2>
      <p id="healthStatus" style="text-align:center;margin-bottom:1.5rem;font-weight:600;">Checking backend...</p>
      <div id="itemList" class="cards">
        <p style="text-align:center">Loading items...</p>
      </div>
    </section>

    <section id="stats" class="section stats-section">
      <h2>Live Stats</h2>
      <div id="statsGrid" class="stats-grid">
        <p style="text-align:center">Loading stats...</p>
      </div>
    </section>

    <section id="contact" class="section contact">
      <h2>Contact Us</h2>
      <form id="contactForm">
        <input type="text" placeholder="Your Name" required />
        <input type="email" placeholder="Your Email" required />
        <textarea placeholder="Your Message" rows="5" required></textarea>
        <button type="submit" class="btn">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 MyApp. All rights reserved.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
