name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend-app/index.html,frontend-app/style.css,frontend-app/app.js,backend/"
          target: "/home/ubuntu/myapp"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Deploy frontend
            sudo cp /home/ubuntu/myapp/frontend-app/index.html /var/www/myapp/
            sudo cp /home/ubuntu/myapp/frontend-app/style.css /var/www/myapp/
            sudo cp /home/ubuntu/myapp/frontend-app/app.js /var/www/myapp/
            sudo chown -R www-data:www-data /var/www/myapp

            # Install backend dependencies
            cd /home/ubuntu/myapp/backend
            npm install --production

            # Reload backend (graceful — zero downtime)
            pm2 reload myapp-backend

            # Reload Nginx
            sudo nginx -t && sudo systemctl reload nginx
