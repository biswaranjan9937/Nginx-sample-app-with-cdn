name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull latest code
            cd /home/ubuntu/myapp
            git pull origin main

            # Deploy frontend
            sudo cp frontend-app/index.html /var/www/myapp/
            sudo cp frontend-app/style.css /var/www/myapp/
            sudo cp frontend-app/app.js /var/www/myapp/
            sudo chown -R www-data:www-data /var/www/myapp

            # Deploy backend
            cd /home/ubuntu/myapp/backend
            npm install --production

            # Restart backend
            pm2 restart myapp-backend

            # Reload Nginx (only if config changed)
            sudo nginx -t && sudo systemctl reload nginx
